data_structure:
  n_blocks: 6
  n_trials: 240
  n_trials_per_class:
    bilateral: 120
    unilateral: 120
  trials_context: '3 sets of 40 executed movements per condition by design; one run per set. Subjects 1-8: 6 runs (subject
    XP01: 7 recordings, its third unilateral set split in two), 240 movement trials. Subjects 9-14: 3 unilateral runs, 120
    movement trials. Error and additional trials are dropped (only onsets followed by the end-of-correct-trial marker S128
    are kept); one rest trial is added per correct movement whose preceding rest lasted at least 5 s. Loaded: 1,662 unilateral,
    959 bilateral and 2,542 rest trials (subjects 9-14: 116-119 movements, as most of their recordings also mark the first
    hand placement with S128).'
documentation:
  country: DE
  data_url: https://doi.org/10.5281/zenodo.17940098
  description: EEG dataset of self-initiated, executed unilateral (right arm) and bilateral reaching movements from 14 healthy
    subjects (8 in both conditions, 6 in the unilateral condition only), for movement intention recognition in exoskeleton-supported
    rehabilitation.
  doi: 10.1038/s41598-024-65910-8
  institution: German Research Centre for Artificial Intelligence (DFKI)
  investigators:
  - Niklas Kueper
  - Su Kyoung Kim
  - Kartik Chari
  - Elsa Andrea Kirchner
  keywords:
  - EEG
  - movement intention
  - movement execution
  - ERP
  - BCI
  - stroke rehabilitation
  - LRP
  license: CC-BY-4.0
  publication_year: 2024
  repository: Zenodo
experiment:
  class_labels:
  - unilateral
  - bilateral
  - rest
  events:
    bilateral: 2
    rest: 3
    unilateral: 1
  feedback_type: none
  mode: offline
  n_classes: 3
  paradigm: imagery
  study_design: 'Executed (not imagined), self-initiated, self-paced reaching movements: unilateral (right thumb presses a
    button in front of the participant) and bilateral (both arms synchronously), each followed by a return of the hands to
    hand switches. Each movement follows a rest of at least 5 s with the hands on the switches; a shorter rest triggered an
    error message. 3 sets of 40 movements per condition. First study: 8 subjects, both conditions; second study: 6 subjects,
    unilateral only.'
  synchronicity: self-paced
  trial_duration: 3.0
file_format: BrainVision
paradigm_specific:
  detected_paradigm: motor_imagery
  imagery_tasks:
  - unilateral
  - bilateral
  - rest
